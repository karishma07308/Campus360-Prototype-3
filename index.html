<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Campus360 prototype</title>
<style>
:root{color-scheme:light;--bg:#fff;--cd:#fff;--sf:#f6f7f9;--bd:#e5e7ec;--tx:#1c1f26;--mu:#6b7280;--pk:#f7b8d0;--yl:#ffd9ae;--gn:#bfe9cf;--rd:#ffc7c0;--ac:#d9608f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:480px;margin:0 auto;padding:14px 14px 92px}
h1{font-size:22px;font-weight:650;margin:4px 0 10px}h3{margin:0 0 6px;font-size:15px;font-weight:650}
.c{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin:0 0 10px;box-shadow:0 1px 2px #0000000d}
.mu{color:var(--mu);font-size:13px}.r{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0}
.b{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap;color:var(--tx)}
.pk{background:var(--pk)}.yl{background:var(--yl)}.gn{background:var(--gn)}.rd{background:var(--rd)}.wh{background:#fff}.gy{background:#e5e7eb}
button{font:inherit;border:1px solid var(--bd);background:var(--cd);color:var(--tx);border-radius:10px;padding:8px 12px;cursor:pointer}
button.p{background:var(--pk);color:#4a1230;border-color:#f0a3c3;font-weight:600}button.y{background:var(--yl);color:#5a3200;border-color:#f5c58f;font-weight:600}
button:disabled{opacity:.5;cursor:default}:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
a{color:var(--ac);font-weight:600}
input,select{font:inherit;width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:10px;background:var(--sf);color:var(--tx);margin:4px 0}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#fff;border-top:1px solid var(--bd);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;border:0;background:none;font-size:11px;color:var(--mu);padding:4px 0}nav button.on{color:var(--ac);font-weight:700}nav i{display:block;margin-bottom:2px}nav svg{display:block;margin:0 auto}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:10px}
.t{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 4px;font-size:12px;font-weight:600;text-align:center}
.t i{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:var(--pk)}
.t:nth-child(3n+2) i{background:var(--yl)}.t:nth-child(3n) i{background:var(--gn)}
.av{width:44px;height:44px;border-radius:50%;background:var(--pk);color:#4a1230;font-weight:700;padding:0;border:0}.av.big{width:84px;height:84px;font-size:28px;margin:0 auto 8px;display:flex;align-items:center;justify-content:center}
.seg{display:flex;gap:6px;margin:0 0 10px;flex-wrap:wrap}.seg button{flex:1;white-space:nowrap}
.dots i{display:inline-block;width:13px;height:13px;border-radius:50%;border:2px solid var(--ac);margin-right:5px}.dots i.f{background:var(--ac)}
.bar{height:8px;border-radius:6px;background:var(--bd);overflow:hidden;flex:1}.bar i{display:block;height:100%;background:#f2a65a}
.ch{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.ch span{font-size:12px;padding:3px 9px;border-radius:99px;border:1px solid var(--bd)}.ch .k{border-color:#7cc9a0;background:#effaf3}.ch .l{text-decoration:line-through;color:var(--mu)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:13px}.cal b{color:var(--mu);font-size:11px}
.cal button{padding:7px 0;border-radius:10px;background:var(--sf);border:0}.cal .rd,.cal .yl,.cal .pk{color:var(--tx)}.cal .sel{outline:2px solid var(--tx)}
.pr{display:flex;gap:10px;overflow-x:auto;margin:0 0 10px;padding-bottom:4px}.po{flex:0 0 78%;border-radius:14px;padding:14px;min-height:128px;color:var(--tx);display:flex;flex-direction:column;justify-content:flex-end;gap:4px}.po b.t2{font-size:21px;line-height:1.1}
.mo{position:fixed;inset:0;background:#1c1f2699;display:flex;align-items:center;justify-content:center;padding:20px;z-index:9}.mo .c{max-width:360px;border-color:var(--rd)}
svg.mp{width:100%;background:var(--sf);border-radius:12px;border:1px solid var(--bd)}svg.mp text{font:9px system-ui;fill:#374151}
.rt{stroke-dasharray:6 4;animation:dash 1s linear infinite}@keyframes dash{to{stroke-dashoffset:-20}}
.tm{font-size:60px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;color:var(--ac);margin:10px 0}
.lb{display:flex;align-items:center;gap:8px;padding:6px 4px;border-radius:8px}.lb span:first-child{width:84px}.lb b{width:34px;text-align:right}.me{font-weight:700}
.fl{animation:fl 1.2s ease-out}@keyframes fl{from{background:#f7b8d0aa}to{background:transparent}}
@media(prefers-reduced-motion:reduce){.rt,.fl{animation:none}}
.big{font-size:28px;font-weight:500;letter-spacing:-.5px;margin:0}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.st div{border-radius:20px;padding:12px;min-height:104px;display:flex;flex-direction:column;justify-content:space-between}
.st b{font-size:28px;font-weight:600}.st span{font-size:12px}.st small{font-size:11px;color:var(--mu)}
.sc1{background:linear-gradient(160deg,#f3e8ff,#fbcfe8)}.sc2{background:linear-gradient(160deg,#ccfbf1,#a5e6e8)}.sc3{background:#fff;border:1px solid var(--bd)}
.dk{background:#1f2125;color:#fff;border-radius:20px;padding:12px 14px;margin:0 0 10px}.dk button{background:#fff;color:#1f2125;border:0}.dk .mu{color:#c9ccd1}
.c,.po{border-radius:20px}#app{padding-bottom:104px}
nav{left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));border:1px solid var(--bd);border-radius:24px;padding:6px;box-shadow:0 8px 24px #0000001a}
nav button.on{background:#1f2125;color:#fff;border-radius:18px}
.seg button.p{background:#1f2125;color:#fff;border-color:#1f2125}
.t i{background:linear-gradient(160deg,#f3e8ff,#fbcfe8)}.t:nth-child(3n+2) i{background:linear-gradient(160deg,#ffe8cc,#ffd9ae)}.t:nth-child(3n) i{background:linear-gradient(160deg,#ccfbf1,#bfe9cf)}
.av{background:#1f2125;color:#fff}.wv text{font:10px system-ui;fill:#6b7280}.wv .l{font-size:11px;fill:#fff}
</style></head><body>
<div id="app"></div><nav id="nav"></nav><div id="mo"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';');
const CUT=[[90,10,'O'],[80,9,'A'],[70,8,'B'],[60,7,'C'],[50,6,'D'],[40,5,'P']],M=6e4,N=Date.now(),D0=new Date();D0.setHours(0,0,0,0);
const dayOf=ms=>Math.floor((ms-D0)/864e5),POS=['Matched','Booked','Completed'];
const EV=[{t:'Coding workshop',w:'Hall B',h:-1,l:3,g:'#f7b8d0,#ffd9ae'},{t:'Robotics talk',w:'Seminar room',h:2,l:2,g:'#ffd9ae,#bfe9cf'},{t:'Tech fest quiz night',w:'Auditorium',h:30,l:2,g:'#bfe9cf,#f7b8d0'},{t:'Freshers meet',w:'Ground',h:-30,l:3,g:'#f7b8d0,#bfe9cf'}];
const CI=[...EV.map(e=>({o:dayOf(N+e.h*36e5),t:e.t,k:'Event',s:e.w})),{o:1,t:'Chemistry assignment',k:'Deadline',s:'Submit on the LMS by 11:59 pm'},{o:2,t:'Maths unit test',k:'Deadline',s:'Chapters 1 to 3'},{o:6,t:'Physics lab record',k:'Deadline',s:'Submit to the lab in-charge'},{o:12,t:'Mid-sem form',k:'Deadline',s:'Fill it on the portal'}];
const P=[{id:0,n:'Library',c:'Library',x:200,y:55,t:'9 am to 5 pm',d:'Ground floor, Main building'},{id:1,n:'Canteen',c:'Food',x:85,y:105,t:'8 am to 6 pm',d:'Behind the ground'},{id:2,n:'Admin office (ID cards, fees)',c:'Academic',x:135,y:40,t:'10 am to 4 pm',d:'Room 12, Main building'},{id:3,n:'Computer Lab 2',c:'Labs',x:235,y:120,t:'9 am to 5 pm',d:'Second floor, Lab block'},{id:4,n:"Girls' Hostel 3",c:'Hostel',x:255,y:170,t:'Warden available 24 hours',d:'North of the sports ground'},{id:5,n:'Main building',c:'Academic',x:150,y:90,t:'8 am to 6 pm',d:'Faculty cabins on floors 1 to 4'}];
const F=[{n:'Prof. Sharma',d:'Computer Eng',r:'Cabin 301',s:'In cabin'},{n:'Dr. Iyer',d:'IT',r:'Cabin 205',s:'In class'},{n:'Prof. Khan',d:'AI and DS',r:'Cabin 410',s:'Busy'},{n:'Dr. Patil',d:'EXTC',r:'Cabin 118',s:'In cabin'},{n:'Prof. Desai',d:'Maths',r:'Cabin 302',s:'In cabin'}];
const BK=[['Higher Engineering Mathematics','B.S. Grewal','Maths',1,1],['Engineering Mathematics','H.K. Dass','Maths',1,0],['Concepts of Physics','H.C. Verma','Physics',1,1],['Engineering Physics','Gaur and Gupta','Physics',1,1],['Engineering Chemistry','Jain and Jain','Chemistry',1,0],['Let Us C','Yashavant Kanetkar','Programming',1,1],['Data Structures','Seymour Lipschutz','Programming',2,1],['Basic Electrical Engineering','V.K. Mehta','Electrical',1,1],['Engineering Mechanics','S.S. Bhavikatti','Mechanics',1,0],['Digital Electronics','Morris Mano','Electronics',2,1]];
const S={tab:'home',user:0,phone:'',otp:0,err:'',pop:0,sel:0,me:'Comp-A',target:8.5,form:0,lb:'div',flash:0,mt:'pl',pl:0,cat:'All',free:0,loc:'',bs:'All',ba:0,qs:'All',cr:2,reg:{},int:['Coding','Football','Photography'],tm:{m:20,left:0,st:0,run:0},
sub:[{n:'Maths',c:4,i:30,e:40},{n:'Physics',c:3,i:28,e:40},{n:'Chemistry',c:3,i:15,e:40},{n:'Programming',c:4,i:34,e:40}],
rides:[{to:'Kurla station',v:'Sharing auto',by:'Riya',n:2,fixed:1,exp:N+20*M},{to:'Thane',v:'Cab',by:'Karan',n:3,fixed:0,total:480,exp:N+12*M},{to:'Dadar',v:'Meter auto',by:'Sneha',n:1,fixed:0,total:240,exp:N+18*M}],
divs:[{d:'Comp-A',b:'Computer Eng',p:120},{d:'Comp-B',b:'Computer Eng',p:150},{d:'Comp-C',b:'Computer Eng',p:90},{d:'IT-A',b:'IT',p:140},{d:'IT-B',b:'IT',p:110},{d:'AIDS-A',b:'AI and DS',p:130},{d:'EXTC-A',b:'EXTC',p:100}],
tasks:[{t:'Collect 20 books for the library drive',p:50,done:0},{t:'Attend the Friday coding workshop',p:30,done:0},{t:'Post a photo of the campus clean-up',p:40,done:0}],
ps:[{w:'Sneha',sk:'Python basics',m:'learn',st:0},{w:'Karan',sk:'Guitar chords',m:'learn',st:0},{w:'You',sk:'Maths revision',m:'teach',st:1}]};
const gr=t=>CUT.find(c=>t>=c[0])||[0,0,'F'],weak=()=>S.sub.reduce((a,b)=>b.i<a.i?b:a);
const sg=a=>{let n=0,d=0;S.sub.forEach((s,i)=>{n+=s.c*gr(a[i])[1];d+=s.c});return n/d};
const cc=o=>o<0?'gy':o<=2?'rd':o<=7?'yl':'pk',ES=e=>e.h>3?['Registration open','pk']:e.h>0?['Starting soon','yl']:e.h>-e.l?['Live now','gn']:['Event ended','gy'];
const IC={"home": "<path d=\"M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z\"/>", "cal": "<rect x=\"3\" y=\"4\" width=\"18\" height=\"17\" rx=\"2\"/><path d=\"M3 9h18M8 2v4M16 2v4\"/>", "plan": "<circle cx=\"12\" cy=\"12\" r=\"9\"/><circle cx=\"12\" cy=\"12\" r=\"5\"/><circle cx=\"12\" cy=\"12\" r=\"1\"/>", "timer": "<circle cx=\"12\" cy=\"13\" r=\"8\"/><path d=\"M12 9v4l2.5 2M9 2h6\"/>", "pin": "<path d=\"M12 21s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z\"/><circle cx=\"12\" cy=\"9\" r=\"2.5\"/>", "car": "<path d=\"M5 16v-5l2-5h10l2 5v5M3 16h18v3H3zM7.5 13h.01M16.5 13h.01\"/>", "cup": "<path d=\"M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3\"/>", "book": "<path d=\"M4 19.5V5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2zM4 19.5A2 2 0 0 0 6 21h13\"/>", "users": "<circle cx=\"9\" cy=\"8\" r=\"3.5\"/><path d=\"M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18.5 14a6 6 0 0 1 3 6\"/>", "file": "<path d=\"M6 2h8l5 5v15H6zM14 2v5h5M9 13h7M9 17h7\"/>", "user": "<circle cx=\"12\" cy=\"8\" r=\"4\"/><path d=\"M4 21a8 8 0 0 1 16 0\"/>"},ic=n=>`<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]}</svg>`;
const ph=t=>`<div class="r"><h1>${t}</h1><button onclick="S.tab='home';go()">Home</button></div>`;
const poster=(e,i)=>{const s=ES(e);return `<div class="po" style="background:linear-gradient(135deg,${e.g})"><span class="b ${s[1]}" style="align-self:flex-start;background:#fff">${s[0]}</span><b class="t2">${e.t}</b><span>${e.w}</span>${s[1]=='pk'?`<button class="${S.reg[i]?'':'p'}" style="align-self:flex-start;background:#1c1f26;color:#fff;border-color:#1c1f26" onclick="S.reg[${i}]=1;go()">${S.reg[i]?'Registered':'Register'}</button>`:''}</div>`};
function go(){const v={home,cal,planner,focus,map,rides,chal,lib,peer,pyq,me}[S.tab];$('#app').innerHTML=S.user?v():login();
$('#nav').innerHTML=S.user?[['home','Home','home'],['cal','Calendar','cal'],['map','Map','pin'],['rides','Rides','car'],['me','Profile','user']].map(t=>`<button class="${S.tab==t[0]?'on':''}" onclick="S.tab='${t[0]}';go();scrollTo(0,0)"><i>${ic(t[2])}</i>${t[1]}</button>`).join(''):'';
const d=CI.find(x=>x.k=='Deadline'&&x.o>=0&&x.o<=2);$('#mo').innerHTML=S.user&&S.pop&&d?`<div class="mo"><div class="c"><h3>You need to do this</h3><p>${d.t} is due ${d.o==1?'tomorrow':'in '+d.o+' days'}. ${d.s}.</p><div class="r"><button onclick="S.pop=0;go()">Later</button><button class="p" onclick="S.pop=0;S.tab='focus';go()">Start focus timer</button></div></div></div>`:''}
function login(){const e=S.err?`<p class="b rd">${S.err}</p>`:'';return `<h1>Campus360</h1><div class="c">`+(S.otp?`<div class="mu">Enter the OTP sent to ${esc(S.phone)}. Demo OTP: 1234</div><input id="ot" inputmode="numeric" maxlength="4" placeholder="1234">${e}<div class="r"><button onclick="S.otp=0;S.err='';go()">Change number</button><button class="p" onclick="verify()">Verify and log in</button></div>`:`<div class="mu">Log in with your phone number</div><input id="ph" inputmode="tel" maxlength="10" placeholder="10-digit mobile number" value="${esc(S.phone)}">${e}<button class="p" onclick="send()">Send OTP</button>`)+`</div><p class="mu">Prototype: login is simulated. MiniMoth phone OTP connects in the full build.</p>`}
function send(){const p=$('#ph').value.trim();S.phone=p;if(!/^\d{10}$/.test(p)){S.err='Enter a 10-digit number';return go()}S.err='';S.otp=1;go()}
function verify(){if($('#ot').value==='1234'){S.user=1;S.err='';S.tab='home';S.pop=1}else S.err='Wrong OTP. Try 1234';go()}
function home(){const ev=EV.findIndex(e=>ES(e)[1]!='gy'),cur=sg(S.sub.map(s=>s.i+s.e)),rk=[...S.divs].sort((a,b)=>b.p-a.p).findIndex(d=>d.d==S.me)+1,d=CI.find(x=>x.k=='Deadline'&&x.o>=0),
T=[['cal','cal','Calendar and events'],['planner','plan','Planner'],['focus','timer','Focus timer'],['map','pin','Who to contact'],['rides','car','Rides'],['chal','cup','Challenges'],['lib','book','Library'],['peer','users','Peer learning'],['pyq','file','PYQs']],
a=[7.2,7.6,7.4,7.9,8,cur],pt=a.map((v,i)=>[20+i*52,84-(v-6.5)*36]);let p='M'+pt[0];for(let i=1;i<pt.length;i++){const m=(pt[i-1][0]+pt[i][0])/2;p+=` C${m},${pt[i-1][1]} ${m},${pt[i][1]} ${pt[i][0]},${pt[i][1]}`}const L=pt[5];
return `<div class="r"><div><h1 class="big">Hi Aarav</h1><div class="mu">First year, ${S.me}. Everything for today.</div></div><button class="av" onclick="S.tab='me';go()" aria-label="Profile">AV</button></div>
<div class="st"><div class="sc1"><span>SGPA</span><b>${cur.toFixed(1)}</b><small>projected</small></div><div class="sc2"><span>Credits</span><b>${S.cr}</b><small>time credits</small></div><div class="sc3"><span>Rank</span><b>${['1st','2nd','3rd'][rk-1]||rk+'th'}</b><small>in challenges</small></div></div>
<div class="c"><h3 style="font-weight:500;font-size:17px">SGPA trend</h3><svg class="wv" viewBox="0 0 300 110" style="width:100%"><path d="${p}" fill="none" stroke="#7dd3d0" stroke-width="2.5"/><circle cx="${L[0]}" cy="${L[1]}" r="5" fill="#1f2125"/><rect x="${L[0]-20}" y="${L[1]-30}" width="40" height="20" rx="10" fill="#1f2125"/><text class="l" x="${L[0]}" y="${L[1]-16}" text-anchor="middle">${cur.toFixed(1)}</text>${['T1','T2','T3','T4','T5','Now'].map((x,i)=>`<text x="${20+i*52}" y="106" text-anchor="middle">${x}</text>`).join('')}</svg></div>
${d?`<div class="dk r"><div><b>${d.t}</b><div class="mu">Due ${d.o==1?'tomorrow':d.o==0?'today':'in '+d.o+' days'}. ${weak().n} needs ${Math.max(0,70-weak().i)} of 60 for a B.</div></div><button onclick="S.tab='focus';go()">Plan it</button></div>`:''}
<div class="pr">${poster(EV[ev],ev)}</div><div class="g">${T.map(t=>`<button class="c t" onclick="S.tab='${t[0]}';go();scrollTo(0,0)"><i>${ic(t[1])}</i>${t[2]}</button>`).join('')}</div>
<div class="c"><h3>Today</h3><div class="r"><span>10:00 Maths</span><span class="mu">Room 204</span></div><div class="r"><span>12:00 Physics lab</span><span class="mu">Lab 2</span></div></div>`}
function cal(){const y=D0.getFullYear(),m=D0.getMonth(),f=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate();let g='';for(let i=0;i<f;i++)g+='<span></span>';
for(let d=1;d<=n;d++){const o=d-D0.getDate(),has=CI.some(x=>x.o==o);g+=`<button class="${has?cc(o):''} ${o==S.sel?'sel':''}" onclick="S.sel=${o};go()">${d}</button>`}
const it=CI.filter(x=>x.o==S.sel);
return ph('Calendar and events')+`<div class="pr">${EV.map(poster).join('')}</div><div class="c"><h3>${D0.toLocaleString('en',{month:'long'})} ${y}</h3><div class="cal">${'SMTWTFS'.split('').map(x=>`<b>${x}</b>`).join('')}${g}</div>
<div class="ch"><span class="rd" style="background:var(--rd);color:var(--tx)">Within 2 days</span><span style="background:var(--yl);color:var(--tx)">Within a week</span><span style="background:var(--pk);color:var(--tx)">Later</span></div></div>
<div class="c"><h3>${S.sel==0?'Today':S.sel==1?'Tomorrow':'Day '+(D0.getDate()+S.sel)}</h3>${it.length?it.map(x=>`<div class="r"><div><b>${x.t}</b><div class="mu">${x.s}</div></div><span class="b ${cc(x.o)}">${x.k}</span></div>${x.k=='Deadline'&&x.o>=0?`<button class="y" onclick="S.tab='focus';go()">Plan it with the timer</button>`:''}`).join(''):'<span class="mu">Nothing planned. Pick a coloured day.</span>'}</div>`}
function planner(){const best=sg(S.sub.map(s=>s.i+60)),cur=sg(S.sub.map(s=>s.i+s.e)),ok=best>=S.target;
return ph('Planner')+`<div class="c"><div class="mu">Sample cutoffs: O 90, A 80, B 70, C 60, D 50, Pass 40 (real scale set at the event)</div><div class="r"><label for="tg">Target SGPA</label><input id="tg" style="width:90px" type="number" step="0.1" min="5" max="10" value="${S.target}" onchange="S.target=+this.value;go()"></div>
<div class="r"><span class="b ${ok?'gn':'rd'}">${ok?'Achievable':'Not achievable'}</span><span>Best possible: <b>${best.toFixed(2)}</b></span></div><div class="r"><span>What-if SGPA</span><b>${cur.toFixed(2)}</b></div></div>`+
S.sub.map((s,i)=>`<div class="c"><div class="r"><b>${s.n}</b><span class="mu">${s.c} credits</span></div><div class="r"><span>Internal (of 40)</span><input aria-label="Internal marks" style="width:76px" type="number" min="0" max="40" value="${s.i}" onchange="S.sub[${i}].i=Math.min(40,Math.max(0,+this.value||0));go()"></div>
<div class="r"><span>What-if final: <b>${s.e}</b> of 60</span><input aria-label="What-if final" style="width:46%" type="range" min="0" max="60" value="${s.e}" onchange="S.sub[${i}].e=+this.value;go()"></div>
<div class="mu">Marks needed in the final</div><div class="ch">${CUT.map(c=>{const n=c[0]-s.i;return n>60?`<span class="l">${c[2]} locked</span>`:n<=0?`<span class="k">${c[2]} secured</span>`:`<span>${c[2]}: ${n}</span>`}).join('')}</div></div>`).join('')}
function advice(m){const w=weak(),d=CI.find(x=>x.k=='Deadline'&&x.o>=0);return m<=10?`Revise the key formulas of ${w.n}. It is your weakest subject (${Math.round(w.i/.4)}%).`:m<=20?`Solve one exercise set of ${w.n}, your weakest subject (${Math.round(w.i/.4)}%).`:`Work on "${d.t}" (due ${d.o==1?'tomorrow':'soon'}), then revise ${w.n}.`}
const fm=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
function focus(){const t=S.tm;let b;
if(!t.st)b=`<div class="c"><h3>How much time do you have?</h3><div class="seg">${[5,10,20,30,45].map(m=>`<button class="${t.m==m?'y':''}" onclick="S.tm.m=${m};go()">${m} min</button>`).join('')}</div><p>${advice(t.m)}</p><button class="p" onclick="startT()">Confirm and start ${t.m} min</button></div>`;
else b=`<div class="c"><div class="mu">${advice(t.m)}</div><div class="tm" id="tm">${fm(t.left)}</div>${t.left?`<div class="r"><button onclick="S.tm.run=!S.tm.run;go()">${t.run?'Pause':'Resume'}</button><button onclick="S.tm.st=0;S.tm.run=0;go()">Stop</button></div>`:`<p class="b gn">Time is up. Well done!</p><button class="p" onclick="S.tm.st=0;go()">Done</button>`}</div>`;
return ph('Focus timer')+b}
function startT(){S.tm.st=1;S.tm.left=S.tm.m*60;S.tm.run=1;go()}
setInterval(()=>{const t=S.tm;if(t.run&&t.left>0){t.left--;const e=$('#tm');if(e)e.textContent=fm(t.left);if(!t.left){t.run=0;if(S.tab=='focus')go()}}},1000);
function map(){const p=P[S.pl],cats=['All','Academic','Library','Food','Labs','Hostel'],gx=30,gy=175;
const route=`M${gx},${gy} L${p.x},${gy} L${p.x},${p.y}`,dx=Math.round((p.x-gx)*3),dy=Math.round((gy-p.y)*3);
const lat=(19.0457+(gy-p.y)*1e-5).toFixed(5),lng=(72.8896+(p.x-gx)*1e-5).toFixed(5),url=`https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}&travelmode=walking${S.loc?'&origin='+S.loc:''}`;
const L=P.filter(x=>S.cat=='All'||x.c==S.cat);
return ph('Who do I contact?')+`<div class="seg"><button class="${S.mt=='pl'?'p':''}" onclick="S.mt='pl';go()">Places</button><button class="${S.mt=='fa'?'p':''}" onclick="S.mt='fa';go()">Faculty</button></div>`+
`<svg class="mp" viewBox="0 0 300 200" role="img" aria-label="Campus map"><rect x="10" y="10" width="280" height="180" rx="8" fill="#fff" stroke="#d1d5db"/><path d="M30,175 H270 M150,175 V30" stroke="#e5e7eb" stroke-width="10" fill="none"/><path class="rt" d="${route}" stroke="#d9608f" stroke-width="3" fill="none"/>
${P.map(q=>`<circle cx="${q.x}" cy="${q.y}" r="${q.id==S.pl?7:5}" fill="${q.id==S.pl?'#d9608f':'#f2a65a'}" onclick="S.pl=${q.id};go()"/><text x="${q.x+8}" y="${q.y+3}">${q.n.split(' (')[0]}</text>`).join('')}<circle cx="${gx}" cy="${gy}" r="5" fill="#3fa56f"/><text x="38" y="190">You (main gate)</text></svg>`+
`<div class="c" style="margin-top:10px"><div class="r"><b>${p.n}</b><span class="b yl">${p.c}</span></div><div class="mu">${p.d}. ${p.t}.</div><p>Walk ${Math.abs(dx)} m east, then ${dy} m north. <span class="mu">(sample route)</span></p>
<div class="r"><button onclick="loc()">${S.loc?'Location on':'Use my location'}</button><a href="${url}" target="_blank" rel="noopener">Open directions</a></div><div class="mu">Sample pins. Real coordinates are added at the event.</div></div>`+
(S.mt=='pl'?`<div class="seg">${cats.map(c=>`<button class="${S.cat==c?'y':''}" onclick="S.cat='${c}';go()">${c}</button>`).join('')}</div>${L.map(q=>`<div class="c r" style="margin-bottom:6px"><span>${q.n}</span><button onclick="S.pl=${q.id};go();scrollTo(0,0)">Show</button></div>`).join('')}`
:`<div class="seg"><button class="${S.free?'p':''}" onclick="S.free=!S.free;go()">${S.free?'Showing free now':'Show only free now'}</button></div>${F.filter(f=>!S.free||f.s=='In cabin').map(f=>`<div class="c"><div class="r"><b>${f.n}</b><span class="b ${f.s=='In cabin'?'gn':f.s=='In class'?'yl':'rd'}">${f.s=='In cabin'?'Free now':f.s}</span></div><div class="mu">${f.d}, ${f.r}</div><button onclick="S.pl=5;S.mt='pl';go();scrollTo(0,0)">Show cabin</button></div>`).join('')}`)}
function loc(){navigator.geolocation&&navigator.geolocation.getCurrentPosition(p=>{S.loc=p.coords.latitude+','+p.coords.longitude;go()},()=>{S.err='';go()})}
function rs(r){return r.cx?'Cancelled':r.n>=4?'Full':Date.now()>r.exp?'Expired':'Open'}
function rides(){return `<div class="r"><h1>Rides</h1><button class="p" onclick="S.form=!S.form;go()">${S.form?'Close':'Post a ride'}</button></div>`+(S.form?`<div class="c"><label class="mu" for="ft">Going to</label><input id="ft" value="Kurla station"><label class="mu" for="fv">Vehicle</label><select id="fv"><option>Sharing auto</option><option>Meter auto</option><option>Cab</option></select><label class="mu" for="fa">Estimated total fare in Rs (meter auto or cab)</label><input id="fa" type="number" value="120"><p class="mu">You take 1 of 4 seats. The ride expires in 15 minutes.</p><button class="p" onclick="post()">Post ride</button></div>`:'')+
S.rides.map((r,i)=>{const st=rs(r),f=r.fixed?30:Math.round(r.total/r.n),m=Math.max(0,Math.ceil((r.exp-Date.now())/M)),c=st=='Open'?'gn':st=='Full'?'yl':'rd';
const a=r.mine?(st=='Open'?`<button onclick="join(${i})">Simulate a join</button> <button onclick="cancel(${i})">Cancel ride</button>`:''):r.req=='Confirmed'?'<span class="b gn">Confirmed</span>':r.req=='Requested'?'<span class="b yl">Requested</span>':st=='Open'?`<button class="p" onclick="req(${i})">Request seat</button>`:'';
return `<div class="c"><div class="r"><b>VESIT to ${esc(r.to)}</b><span class="b ${c}">${st}</span></div><div class="mu">${r.v}, posted by ${esc(r.by)}${st=='Open'?', '+m+' min left':''}</div><div class="r"><span class="dots">${[0,1,2,3].map(k=>`<i class="${k<r.n?'f':''}"></i>`).join('')}</span><span><b>Rs ${f}</b> each</span></div>${a}</div>`}).join('')}
function post(){const v=$('#fv').value;S.rides.unshift({to:$('#ft').value.trim()||'Kurla station',v,by:'You',n:1,fixed:v=='Sharing auto'?1:0,total:+$('#fa').value||120,exp:Date.now()+15*M,mine:1});S.form=0;go()}
function req(i){const r=S.rides[i];r.req='Requested';go();setTimeout(()=>{if(r.n<4)r.n++;r.req='Confirmed';go()},2200)}
function join(i){if(S.rides[i].n<4)S.rides[i].n++;go()}function cancel(i){S.rides[i].cx=1;go()}
function chal(){let a=S.divs.map(x=>({n:x.d,b:x.b,p:x.p}));if(S.lb=='br'){const m={};a.forEach(x=>m[x.b]=(m[x.b]||0)+x.p);a=Object.keys(m).map(k=>({n:k,b:k,p:m[k]}))}a.sort((x,y)=>y.p-x.p);const mx=a[0].p;
return ph('Class challenges')+`<div class="seg"><button class="${S.lb=='div'?'p':''}" onclick="S.lb='div';go()">Divisions</button><button class="${S.lb=='br'?'p':''}" onclick="S.lb='br';go()">Branches</button></div><div class="c">${a.map((x,i)=>{const me=x.n==S.me||(S.lb=='br'&&x.n=='Computer Eng');return `<div class="lb ${me?'me':''} ${me&&S.flash?'fl':''}"><span>${i+1}. ${x.n}</span><div class="bar"><i style="width:${Math.round(x.p/mx*100)}%"></i></div><b>${x.p}</b></div>`}).join('')}<div class="mu">Sample division names.</div></div>
${S.tasks.map((t,i)=>`<div class="c"><div class="r"><span>${t.t}</span><span class="b yl">${t.p} pts</span></div><button class="${t.done?'':'p'}" ${t.done?'disabled':''} onclick="done(${i})">${t.done?'Completed':'Mark complete'}</button></div>`).join('')}`}
function done(i){const t=S.tasks[i];if(t.done)return;t.done=1;S.divs.find(d=>d.d==S.me).p+=t.p;S.flash=1;go();setTimeout(()=>{S.flash=0},1300)}
function lib(){const sb=['All',...new Set(BK.map(b=>b[2]))],L=BK.filter(b=>(S.bs=='All'||b[2]==S.bs)&&(!S.ba||b[4]));
return ph('Library')+`<div class="c"><label class="mu" for="bs">Subject</label><select id="bs" onchange="S.bs=this.value;go()">${sb.map(x=>`<option ${x==S.bs?'selected':''}>${x}</option>`).join('')}</select><button class="${S.ba?'p':''}" onclick="S.ba=!S.ba;go()">${S.ba?'Showing available only':'Show available only'}</button></div>`+
(L.length?L.map(b=>`<div class="c"><div class="r"><b>${b[0]}</b><span class="b ${b[4]?'gn':'rd'}">${b[4]?'Available':'Issued'}</span></div><div class="mu">${b[1]}, ${b[2]}, semester ${b[3]}</div></div>`).join(''):'<div class="c mu">No books match.</div>')}
function peer(){return ph('Peer learning')+`<div class="c"><div class="r"><span>Your time credits</span><b style="font-size:28px;color:var(--ac)">${S.cr}</b></div><div class="mu">Teach 1 hour to earn 1 credit. Learn 1 hour to spend 1 credit. Credits move when a session is completed.</div></div>`+
S.ps.map((s,i)=>`<div class="c"><div class="r"><b>${s.sk}</b><span class="b ${['pk','yl','gn'][s.st]}">${POS[s.st]}</span></div><div class="mu">${s.m=='learn'?'You learn from '+s.w:'You teach'}</div>${s.st<2?`<button class="p" ${s.m=='learn'&&s.st==0&&S.cr<1?'disabled':''} onclick="adv(${i})">${s.st?'Mark completed':'Book session'}</button>`:''}</div>`).join('')+
`<div class="c"><input id="sk" placeholder="A skill you can teach, e.g. C programming"><button onclick="offer()">Offer to teach</button></div>`}
function adv(i){const s=S.ps[i];s.st++;if(s.st==2)S.cr+=s.m=='teach'?1:-1;go()}function offer(){const v=$('#sk').value.trim();if(v){S.ps.unshift({w:'You',sk:esc(v),m:'teach',st:0});go()}}
function pyq(){const L=[['Maths',2024,'Semester 1 paper'],['Physics',2024,'Semester 1 paper'],['Chemistry',2023,'Semester 1 paper']].filter(x=>S.qs=='All'||x[0]==S.qs);
return ph('Previous year papers')+`<div class="c"><label class="mu" for="qs">Subject</label><select id="qs" onchange="S.qs=this.value;go()">${['All','Maths','Physics','Chemistry','Programming'].map(x=>`<option ${x==S.qs?'selected':''}>${x}</option>`).join('')}</select></div>${L.length?L.map(x=>`<div class="c r"><div><b>${x[0]} ${x[1]}</b><div class="mu">${x[2]}</div></div><span class="b gy">Sample</span></div>`).join(''):'<div class="c mu">No papers yet. They will be added at the event.</div>'}`}
function me(){const A=['Coding','Football','Photography','Music','Robotics','Design'];return `<div class="c" style="text-align:center"><div class="av big">AV</div><h1 style="margin:0">Aarav Mehta</h1><div class="mu">First year, Computer Engineering, ${S.me}</div></div>
<div class="c"><div class="r"><span>Time credits</span><b>${S.cr}</b></div><div class="r"><span>Division points</span><b>${S.divs.find(d=>d.d==S.me).p}</b></div><div class="r"><span>Phone</span><b>${esc(S.phone)}</b></div></div>
<div class="c"><h3>Interests</h3><div class="mu">Tap to change. Events are suggested from these.</div><div class="seg" style="margin-top:8px">${A.map(a=>`<button class="${S.int.includes(a)?'p':''}" onclick="tg('${a}')">${a}</button>`).join('')}</div></div><button onclick="S.user=0;S.otp=0;go()">Log out</button>`}
function tg(a){S.int=S.int.includes(a)?S.int.filter(x=>x!=a):[...S.int,a];go()}
go();
</script></body></html>
